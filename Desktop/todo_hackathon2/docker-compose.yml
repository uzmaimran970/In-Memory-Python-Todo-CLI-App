# Docker Compose for Local Development (T075)
# Runs all services with Dapr sidecars and Kafka
version: '3.9'

services:
  # ─── Infrastructure ───────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Dapr Placement Service ───────────────────────────────
  placement:
    image: daprio/dapr:1.12.0
    command: ["./placement", "--port", "50006"]
    ports:
      - "50006:50006"

  # ─── Application Services ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/todo}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
      - ENVIRONMENT=development
      - DAPR_HTTP_PORT=3500
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - todo-network

  backend-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "backend-svc",
      "--app-port", "8000",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "placement:50006",
      "--resources-path", "/components"
    ]
    volumes:
      - ./deploy/dapr-components:/components
    depends_on:
      - backend
      - placement
    network_mode: "service:backend"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8003
    depends_on:
      - backend
    networks:
      - todo-network

  recurring-service:
    build:
      context: ./services/recurring
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DAPR_HTTP_PORT=3500
      - APP_PORT=8001
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - todo-network

  recurring-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "recurring-svc",
      "--app-port", "8001",
      "--dapr-http-port", "3500",
      "--placement-host-address", "placement:50006",
      "--resources-path", "/components"
    ]
    volumes:
      - ./deploy/dapr-components:/components
    depends_on:
      - recurring-service
      - placement
    network_mode: "service:recurring-service"

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DAPR_HTTP_PORT=3500
      - APP_PORT=8002
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - todo-network

  notification-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "notification-svc",
      "--app-port", "8002",
      "--dapr-http-port", "3500",
      "--placement-host-address", "placement:50006",
      "--resources-path", "/components"
    ]
    volumes:
      - ./deploy/dapr-components:/components
    depends_on:
      - notification-service
      - placement
    network_mode: "service:notification-service"

  websocket-service:
    build:
      context: ./services/websocket
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DAPR_HTTP_PORT=3500
      - APP_PORT=8003
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - todo-network

  websocket-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "websocket-svc",
      "--app-port", "8003",
      "--dapr-http-port", "3500",
      "--placement-host-address", "placement:50006",
      "--resources-path", "/components"
    ]
    volumes:
      - ./deploy/dapr-components:/components
    depends_on:
      - websocket-service
      - placement
    network_mode: "service:websocket-service"

  audit-service:
    build:
      context: ./services/audit
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      - DAPR_HTTP_PORT=3500
      - APP_PORT=8004
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - todo-network

  audit-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "audit-svc",
      "--app-port", "8004",
      "--dapr-http-port", "3500",
      "--placement-host-address", "placement:50006",
      "--resources-path", "/components"
    ]
    volumes:
      - ./deploy/dapr-components:/components
    depends_on:
      - audit-service
      - placement
    network_mode: "service:audit-service"

networks:
  todo-network:
    driver: bridge
