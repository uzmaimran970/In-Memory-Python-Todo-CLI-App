# T006: Kafka Pub/Sub Component for Dapr
# Abstracts Kafka broker for event-driven messaging
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: taskpubsub
  namespace: todo-app
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.kafka.svc.cluster.local:6379"
    - name: redisPassword
      value: ""
---
# Subscription: task-events -> recurring-service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-recurring-sub
  namespace: todo-app
spec:
  pubsubname: taskpubsub
  topic: task-events
  routes:
    default: /events/tasks
  deadLetterTopic: task-events-deadletter
scopes:
  - recurring-svc
---
# Subscription: task-events -> audit-service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-audit-sub
  namespace: todo-app
spec:
  pubsubname: taskpubsub
  topic: task-events
  routes:
    default: /events/audit
  deadLetterTopic: task-events-deadletter
scopes:
  - audit-svc
---
# Subscription: reminders -> notification-service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: reminders-notification-sub
  namespace: todo-app
spec:
  pubsubname: taskpubsub
  topic: reminders
  routes:
    default: /events/reminders
  deadLetterTopic: reminders-deadletter
scopes:
  - notification-svc
---
# Subscription: task-updates -> websocket-service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-updates-websocket-sub
  namespace: todo-app
spec:
  pubsubname: taskpubsub
  topic: task-updates
  routes:
    default: /events/task-updates
  deadLetterTopic: task-updates-deadletter
scopes:
  - websocket-svc
