# Default values for frontend deployment
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # Custom built production image
  repository: todo-frontend
  pullPolicy: Never  # Use local image from minikube's Docker daemon
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "todo-frontend"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# T015: Dapr sidecar annotations for service invocation
podAnnotations:
  dapr.io/enabled: "true"
  dapr.io/app-id: "frontend-svc"
  dapr.io/app-port: "3000"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 8080          # Service port (how other services in cluster call it)
  targetPort: 3000    # Container port (where Next.js listens)
  nodePort: 30080     # External access port (must be 30000-32767 range)

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for the frontend container
env:
  # Backend URL for server-side API calls (internal Kubernetes service)
  BACKEND_URL: "http://todo-backend-backend:8000"