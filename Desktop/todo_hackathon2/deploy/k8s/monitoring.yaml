# Monitoring Configuration (T078)
# Prometheus ServiceMonitor for Dapr sidecars and services
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: todo-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Dapr sidecar metrics
      - job_name: 'dapr-sidecars'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_enabled]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9090"

      # Application services
      - job_name: 'todo-services'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names: ['todo-app']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: (.+)
            target_label: service

      # Kafka metrics
      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka:9092']
---
# Dapr observability configuration
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: todo-app-config
  namespace: todo-app
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin:9411/api/v2/spans"
  metric:
    enabled: true
  logging:
    apiLogging:
      enabled: true
      obfuscateURLs: false
---
# Zipkin for distributed tracing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports:
            - containerPort: 9411
          resources:
            limits:
              memory: 256Mi
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: todo-app
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
